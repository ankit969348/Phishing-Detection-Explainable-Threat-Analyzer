<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ThreatLens Guard</title>
  <style>
    body { width: 330px; margin: 0; padding: 14px; font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; }
    h2 { margin: 0 0 4px; font-size: 16px; display: flex; align-items: center; gap: 6px; color: #38bdf8; }
    p.sub { margin: 0 0 12px; font-size: 11px; color: #94a3b8; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 10px; margin-bottom: 10px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .safe { background: #14532d; color: #86efac; }
    .suspicious { background: #78350f; color: #fde68a; }
    .phishing { background: #7f1d1d; color: #fca5a5; }
    input, textarea { width: 100%; box-sizing: border-box; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 7px; padding: 7px; font-size: 12px; margin-top: 6px; }
    button { width: 100%; margin-top: 8px; padding: 8px; background: #0284c7; color: #fff; border: none; border-radius: 7px; font-weight: 600; cursor: pointer; font-size: 12px; }
    button:hover { background: #0369a1; }
    .small-btn { background: #334155; margin-top: 6px; font-size: 11px; padding: 5px; }
  </style>
</head>
<body>
  <h2>🛡️ ThreatLens Guard</h2>
  <p class="sub">Real-time URL, Email & WhatsApp Web Protection</p>

  <div class="card" id="tab-status">
    <div style="font-size:11px; color:#94a3b8;">Current Tab Status</div>
    <div id="status-body" style="margin-top:4px; font-size:12px;">Monitoring active...</div>
  </div>

  <div class="card">
    <div style="font-size:11px; color:#94a3b8;">Quick Scan (URL or Message)</div>
    <textarea id="quick-input" rows="2" placeholder="Paste suspicious link or message..."></textarea>
    <button id="scan-btn">Analyze Now</button>
    <div id="quick-result" style="margin-top:8px; font-size:12px;"></div>
  </div>

  <div class="card">
    <div style="font-size:11px; color:#94a3b8;">Backend API Endpoint</div>
    <input id="api-input" type="text" placeholder="https://threatlens-backend-fzz3.onrender.com/api" />
    <button class="small-btn" id="save-api-btn">Save Endpoint</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
